<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo dos Dragões</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
    }

    .image-container {
      position: relative;
      width: 100%;
      display: inline-block;
    }

    .image-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: block;
    }

    .button-group {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 15px;
      justify-content: center;
      width: auto;
      z-index: 10;
    }

    .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .btn-play {
      background-color: #e63946;
      color: #ffffff;
    }

    .btn-play:hover {
      background-color: #d62839;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
    }

    .btn-edit {
      background-color: #2a9d8f;
      color: #ffffff;
    }

    .btn-edit:hover {
      background-color: #218377;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42, 157, 143, 0.4);
    }

    /* Estilos para o modo jogo */
    .character {
      position: absolute;
      width: auto;
      height: auto;
      z-index: 5;
    }

    .cave-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-container" id="gameContainer">
      <img id="mainImage" src="dragao1.jpeg" alt="Dragões em combate">
      <div class="button-group" id="buttonGroup">
        <button class="btn btn-play" id="playBtn">Jogar</button>
        <button class="btn btn-edit">Editar dragão</button>
      </div>
    </div>
  </div>

  <script>
    const playBtn = document.getElementById('playBtn');
    const gameContainer = document.getElementById('gameContainer');
    const mainImage = document.getElementById('mainImage');
    const buttonGroup = document.getElementById('buttonGroup');

    playBtn.addEventListener('click', function() {
      // Muda a imagem principal para cave.jpeg
      mainImage.src = 'cave.jpeg';
      mainImage.alt = 'Caverna';
      
      // Esconde os botões
      buttonGroup.style.display = 'none';
      
      // Remove imagens overlay anteriores se existirem
      const existingOverlays = gameContainer.querySelectorAll('.character, .cave-overlay');
      existingOverlays.forEach(el => el.remove());
      
      // Adiciona a imagem seqd.pgn na posição x:30, y:100
      const seqdImage = document.createElement('img');
      seqdImage.src = 'seqd.png';
      seqdImage.alt = 'Personagem';
      seqdImage.className = 'character';
      seqdImage.style.left = '30px';
      seqdImage.style.top = '390px';
      gameContainer.appendChild(seqdImage);
      
      // Adiciona cave1.pgn na mesma posição (sobreposto)
      const caveOverlay = document.createElement('img');
      caveOverlay.src = 'cave1.png';
      caveOverlay.alt = 'Sobreposição da caverna';
      caveOverlay.className = 'cave-overlay';
      gameContainer.appendChild(caveOverlay);
      
      // Inicia a animação de alternância entre 390px e 90px a cada 1 segundo
      let isTop390 = true;
      setInterval(function() {
        seqdImage.style.top = isTop390 ? '-280px' : '390px';
        isTop390 = !isTop390;
      }, 1000);
    });
  </script>

</body>
</html>
