<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo dos Dragões</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
    }

    .image-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: block;
    }

    .button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
    }

    .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .btn-play {
      background-color: #e63946;
      color: #ffffff;
    }

    .btn-play:hover {
      background-color: #d62839;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
    }

    .btn-edit {
      background-color: #2a9d8f;
      color: #ffffff;
    }

    .btn-edit:hover {
      background-color: #218377;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42, 157, 143, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-container">
      <!-- Substitua 'dragao.jpg' pelo caminho final do seu arquivo de imagem -->
      <img src="dragao1.jpg" alt="Dragões em combate">
    </div>

    <div class="button-group">
      <button class="btn btn-play">Jogar</button>
      <button class="btn btn-edit">Editar dragão</button>
    </div>
  </div>

</body>
</html>
