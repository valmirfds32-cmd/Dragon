<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1, minimum-scale=1, viewport-fit=cover">
  <title>Jogo dos Dragões</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body.game-active {
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
    }

    .image-container {
      position: relative;
      width: 100%;
      display: inline-block;
    }

    .image-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: block;
    }

    .button-group {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 15px;
      justify-content: center;
      width: auto;
      z-index: 10;
    }

    .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      touch-action: manipulation;
    }

    .btn-play {
      background-color: #e63946;
      color: #ffffff;
    }

    .btn-play:hover {
      background-color: #d62839;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
    }

    .btn-edit {
      background-color: #2a9d8f;
      color: #ffffff;
    }

    .btn-edit:hover {
      background-color: #218377;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42, 157, 143, 0.4);
    }

    /* Estilos para o modo jogo */
    .character {
      position: absolute;
      width: auto;
      height: auto;
      z-index: 5;
    }

    .cave-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
    }

    /* Estilos do Gauge de Carregamento */
    .loading-gauge-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 20;
      background-color: rgba(18, 18, 18, 0.95);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }

    .loading-gauge-container.active {
      display: flex;
    }

    .gauge-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #e63946;
    }

    .gauge-bar {
      width: 250px;
      height: 30px;
      background-color: #2a2a2a;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid #e63946;
    }

    .gauge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e63946, #d62839);
      transition: width 0.1s linear;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .gauge-percent {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: bold;
    }

    /* Estilo específico para o botão de ataque (imagem) */
    #botatk {
      position: absolute;
      left: 20px;
      top: 140px;
      width: 80px;
      height: auto;
      z-index: 25;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Estilo específico para o botão de magia (imagem) */
    #botmag {
      position: absolute;
      left: 500px;
      top: 1200px;
      width: 80px;
      height: auto;
      z-index: 25;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* Gauges de vitalidade */
    .hp-gauge {
      position: absolute;
      width: 220px;
      z-index: 30;
      background: rgba(15, 15, 15, 0.9);
      padding: 8px 10px 10px;
      border-radius: 10px;
      border: 2px solid;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      touch-action: none;
    }

    .hp-gauge.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .hp-gauge-title {
      font-size: 1rem;
      font-weight: bold;
      color: white;
      margin-bottom: 8px;
      text-align: center;
    }

    .hp-bar {
      width: 100%;
      height: 20px;
      background: #2f2f2f;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #555;
    }

    .hp-fill {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffffff;
      transition: width 0.3s ease;
    }

    #meuvit {
      left: 600px;
      top: 100px;
      border-color: #2a9d8f;
    }

    #bossvit {
      left: 10px;
      top: 100px;
      border-color: #e63946;
    }

    #meuvit .hp-fill {
      background: linear-gradient(90deg, #3ecf8e, #2a9d8f);
    }

    #bossvit .hp-fill {
      background: linear-gradient(90deg, #ff4d4d, #e63946);
    }

    /* Gauges de magia */
    .mag-gauge {
      position: absolute;
      width: 220px;
      z-index: 30;
      background: rgba(15, 15, 15, 0.9);
      padding: 8px 10px 10px;
      border-radius: 10px;
      border: 2px solid;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      touch-action: none;
    }

    .mag-gauge.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .mag-gauge-title {
      font-size: 1rem;
      font-weight: bold;
      color: white;
      margin-bottom: 8px;
      text-align: center;
    }

    .mag-bar {
      width: 100%;
      height: 20px;
      background: #2f2f2f;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #555;
    }

    .mag-fill {
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffffff;
      transition: width 0.3s ease;
    }

    #meumaggauge {
      left: 600px;
      top: 170px;
      border-color: #4a90e2;
    }

    #bossmaggauge {
      left: 10px;
      top: 170px;
      border-color: #ffa500;
    }

    #meumaggauge .mag-fill {
      background: linear-gradient(90deg, #4a90e2, #357abd);
    }

    #bossmaggauge .mag-fill {
      background: linear-gradient(90deg, #ffb84d, #ffa500);
    }

    .dice-label {
      position: absolute;
      left: 100px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
      background: rgba(18, 18, 18, 0.8);
      border: 2px solid #2a9d8f;
      padding: 8px 14px;
      border-radius: 8px;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      touch-action: none;
    }

    .dice-label.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #dado1 { top: 500px; }
    #dado2 { top: 600px; }

    .screen-flash {
      animation: flash 0.3s ease-in-out;
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .character-red-flash {
      animation: redflash 0.3s ease-in-out;
    }

    @keyframes redflash {
      0%, 100% { filter: none; }
      50% { filter: brightness(1.2) sepia(1) hue-rotate(-20deg) saturate(2); }
    }

    .end-screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
      z-index: 50;
      touch-action: none;
    }

    .end-screen.active {
      display: flex;
    }

    .end-screen-text {
      font-size: 3.5rem;
      font-weight: bold;
      color: #e63946;
      animation: pulse 1s infinite ease-in-out;
      text-shadow: 0 0 25px rgba(230, 57, 70, 0.7);
    }

    .end-screen.won .end-screen-text {
      color: #2a9d8f;
      text-shadow: 0 0 25px rgba(42, 157, 143, 0.7);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.09); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-container" id="gameContainer">
      <img id="mainImage" src="dragao1.jpeg" alt="Dragões em combate">
      <div class="button-group" id="buttonGroup">
        <button class="btn btn-play" id="playBtn">Jogar</button>
        <button class="btn btn-edit">Editar dragão</button>
      </div>

      <div class="loading-gauge-container" id="loadingGaugeContainer">
        <div class="gauge-title">Carregando...</div>
        <div class="gauge-bar">
          <div class="gauge-fill" id="gaugeFill"></div>
        </div>
        <div class="gauge-percent" id="gaugePercent">0%</div>
      </div>

      <div class="hp-gauge" id="meuvit">
        <div class="hp-gauge-title">meuvit</div>
        <div class="hp-bar"><div class="hp-fill" id="meuvitFill">3000 / 3000</div></div>
      </div>

      <div class="hp-gauge" id="bossvit">
        <div class="hp-gauge-title">bossvit</div>
        <div class="hp-bar"><div class="hp-fill" id="bossvitFill">5000 / 5000</div></div>
      </div>

      <div class="mag-gauge" id="meumaggauge">
        <div class="mag-gauge-title">meumaggauge</div>
        <div class="mag-bar"><div class="mag-fill" id="meumagFill">5 / 5</div></div>
      </div>

      <div class="mag-gauge" id="bossmaggauge">
        <div class="mag-gauge-title">bossmaggauge</div>
        <div class="mag-bar"><div class="mag-fill" id="bossmagFill">5 / 5</div></div>
      </div>

      <div class="dice-label" id="dado1">dadomeu: 0</div>
      <div class="dice-label" id="dado2">dadobos: 0</div>

      <div class="end-screen" id="endScreen">
        <div class="end-screen-text" id="endScreenText">Game Over</div>
      </div>
    </div>
  </div>

  <script>
    // Desabilitar zoom por pinch e double-tap
    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => {
      e.preventDefault();
    }, { passive: false });

    let lastTouchTime = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchTime < 500 && e.touches.length === 0) {
        e.preventDefault();
      }
      lastTouchTime = now;
    }, { passive: false });

    const playBtn = document.getElementById('playBtn');
    const gameContainer = document.getElementById('gameContainer');
    const mainImage = document.getElementById('mainImage');
    const buttonGroup = document.getElementById('buttonGroup');
    const loadingGaugeContainer = document.getElementById('loadingGaugeContainer');
    const gaugeFill = document.getElementById('gaugeFill');
    const gaugePercent = document.getElementById('gaugePercent');
    const meuvitFill = document.getElementById('meuvitFill');
    const bossvitFill = document.getElementById('bossvitFill');
    const meumagFill = document.getElementById('meumagFill');
    const bossmagFill = document.getElementById('bossmagFill');
    const dado1Label = document.getElementById('dado1');
    const dado2Label = document.getElementById('dado2');
    const endScreen = document.getElementById('endScreen');
    const endScreenText = document.getElementById('endScreenText');
    const meuvitGauge = document.getElementById('meuvit');
    const bossvitGauge = document.getElementById('bossvit');
    const meumaggaugeEl = document.getElementById('meumaggauge');
    const bossmaggaugeEl = document.getElementById('bossmaggauge');

    let game = {
      meuvit: 3000,
      maxMeuvit: 3000,
      bossvit: 5000,
      maxBossvit: 5000,
      meumag: 5,
      maxMeumag: 5,
      bossmag: 5,
      maxBossmag: 5,
      gameEnded: false,
      turnLocked: false
    };

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => reject(new Error(`Erro ao carregar: ${src}`));
        img.src = src;
      });
    }

    function updateGauge(percent) {
      gaugeFill.style.width = percent + '%';
      gaugePercent.textContent = Math.round(percent) + '%';
    }

    function updateHp(element, current, max) {
      const pct = Math.max(0, (current / max) * 100);
      element.style.width = pct + '%';
      element.textContent = `${current} / ${max}`;
    }

    function updateMag(element, current, max) {
      const pct = Math.max(0, (current / max) * 100);
      element.style.width = pct + '%';
      element.textContent = `${current} / ${max}`;
    }

    function flashScreen() {
      gameContainer.classList.remove('screen-flash');
      void gameContainer.offsetWidth;
      gameContainer.classList.add('screen-flash');
      setTimeout(() => gameContainer.classList.remove('screen-flash'), 300);
    }

    function flashCharacterRed(seqdImage) {
      seqdImage.classList.remove('character-red-flash');
      void seqdImage.offsetWidth;
      seqdImage.classList.add('character-red-flash');
      setTimeout(() => seqdImage.classList.remove('character-red-flash'), 300);
    }

    function endGame(won) {
      game.gameEnded = true;
      endScreen.classList.add('active');
      if (won) {
        seqdImage.style.transition = 'none';
        seqdImage.style.top = '-3000px';
        endScreen.classList.add('won');
        endScreenText.textContent = 'Você ganhou';
      } else {
        endScreen.classList.remove('won');
        endScreenText.textContent = 'Game over';
      }
    }

    function rollDice() {
      return Math.floor(Math.random() * 6) + 1;
    }

    async function handleAttack(seqdImage) {
      if (game.gameEnded || game.turnLocked) return;
      game.turnLocked = true;

      // Move o personagem diretamente para y 400 sem transição
      seqdImage.style.transition = 'none';
      seqdImage.style.top = '400px';

      const dadomeu = rollDice();
      const dadobos = rollDice();

      dado1Label.textContent = `dadomeu: ${dadomeu}`;
      dado2Label.textContent = `dadobos: ${dadobos}`;

      await new Promise(resolve => setTimeout(resolve, 300));

      if (dadobos > dadomeu) {
        // Se dadobos é 3 ou 4 e maior que dadomeu
        if (dadobos === 3 || dadobos === 4) {
          // Tira 100 de vitalidade
          game.meuvit = Math.max(0, game.meuvit - 100);
          updateHp(meuvitFill, game.meuvit, game.maxMeuvit);
          flashScreen();
          
          // Reduz 1 de magia do boss
          game.bossmag = Math.max(0, game.bossmag - 1);
          updateMag(bossmagFill, game.bossmag, game.maxBossmag);
        } 
        // Se dadobos é 5 ou 6
        else if (dadobos === 5 || dadobos === 6) {
          // Tira 50 de vitalidade
          seqdImage.style.transition = 'none';
          seqdImage.style.top = '-480px';
          game.meuvit = Math.max(0, game.meuvit - 50);
          updateHp(meuvitFill, game.meuvit, game.maxMeuvit);
          flashScreen();
        }
      } else if (dadomeu > dadobos) {
        //const damage = Math.floor(Math.random() * 51) + 50;
        game.bossvit = Math.max(0, game.bossvit - 100);
        updateHp(bossvitFill, game.bossvit, game.maxBossvit);
        flashCharacterRed(seqdImage);
      }

      // Verificar condição de vitória ANTES de condição de derrota
      if (game.bossvit <= 0) {
        endGame(true);
      } else if (game.meuvit <= 0) {
        endGame(false);
      }

      game.turnLocked = false;
    }

    playBtn.addEventListener('click', async function() {
      loadingGaugeContainer.classList.add('active');
      buttonGroup.style.display = 'none';

      const imagesToLoad = ['cave.jpeg', 'seqd.png', 'cave1.png', 'maof.png', 'maoa.png', 'maor.png'];
      let loadedCount = 0;

      try {
        for (const imageSrc of imagesToLoad) {
          await preloadImage(imageSrc);
          loadedCount++;
          updateGauge((loadedCount / imagesToLoad.length) * 100);
          await new Promise(resolve => setTimeout(resolve, 300));
        }

        await new Promise(resolve => setTimeout(resolve, 500));
        loadingGaugeContainer.classList.remove('active');

        const existingOverlays = gameContainer.querySelectorAll('.character, .cave-overlay');
        existingOverlays.forEach(el => el.remove());

        mainImage.src = 'cave.jpeg';
        mainImage.alt = 'Caverna';

        const seqdImage = document.createElement('img');
        seqdImage.src = 'seqd.png';
        seqdImage.alt = 'Personagem';
        seqdImage.className = 'character';
        seqdImage.style.left = '30px';
        seqdImage.style.top = '-3000px';
        gameContainer.appendChild(seqdImage);

        const caveOverlay = document.createElement('img');
        caveOverlay.src = 'cave1.png';
        caveOverlay.alt = 'Sobreposição da caverna';
        caveOverlay.className = 'cave-overlay';
        caveOverlay.style.top = '-20px';
        gameContainer.appendChild(caveOverlay);

        const botatk = document.createElement('img');
        botatk.id = 'botatk';
        botatk.src = 'maoa.png';
        botatk.alt = 'Botão de ataque';
        botatk.className = 'character';
        botatk.style.left = '300px';
        botatk.style.top = '1200px';
        botatk.style.width = '80px';
        botatk.style.cursor = 'pointer';
        botatk.style.zIndex = '25';
        gameContainer.appendChild(botatk);

        botatk.addEventListener('click', function() {
          const el = this;
          if (el.dataset.locked === 'true') return;
          el.dataset.locked = 'true';
          el.src = 'maof.png';
          handleAttack(seqdImage).finally(() => {
            el.src = 'maoa.png';
            el.dataset.locked = 'false';
          });
        });

        const botmag = document.createElement('img');
        botmag.id = 'botmag';
        botmag.src = 'maof.png';
        botmag.alt = 'Botão de magia';
        botmag.className = 'character';
        botmag.style.left = '500px';
        botmag.style.top = '1200px';
        botmag.style.width = '80px';
        botmag.style.cursor = 'pointer';
        botmag.style.zIndex = '25';
        gameContainer.appendChild(botmag);

        botmag.addEventListener('click', function() {
          const el = this;
          if (el.dataset.locked === 'true') return;
          el.dataset.locked = 'true';
          el.src = 'maor.png';
          setTimeout(() => {
            el.src = 'maof.png';
            el.dataset.locked = 'false';
          }, 500);
        });

        meuvitGauge.classList.add('visible');
        bossvitGauge.classList.add('visible');
        meumaggaugeEl.classList.add('visible');
        bossmaggaugeEl.classList.add('visible');
        dado1Label.classList.add('visible');
        dado2Label.classList.add('visible');

        document.body.classList.add('game-active');
        updateHp(meuvitFill, game.meuvit, game.maxMeuvit);
        updateHp(bossvitFill, game.bossvit, game.maxBossvit);
        updateMag(meumagFill, game.meumag, game.maxMeumag);
        updateMag(bossmagFill, game.bossmag, game.maxBossmag);
      } catch (error) {
        console.error('Erro ao carregar imagens:', error);
        loadingGaugeContainer.classList.remove('active');
        alert('Erro ao carregar as imagens do jogo. Tente novamente.');
        buttonGroup.style.display = 'flex';
      }
    });
  </script>

</body>
</html>
