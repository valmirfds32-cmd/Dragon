<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo dos Dragões</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      width: 100%;
    }

    .image-container {
      position: relative;
      width: 100%;
      display: inline-block;
    }

    .image-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: block;
    }

    .button-group {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 15px;
      justify-content: center;
      width: auto;
      z-index: 10;
    }

    .btn {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .btn-play {
      background-color: #e63946;
      color: #ffffff;
    }

    .btn-play:hover {
      background-color: #d62839;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
    }

    .btn-edit {
      background-color: #2a9d8f;
      color: #ffffff;
    }

    .btn-edit:hover {
      background-color: #218377;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42, 157, 143, 0.4);
    }

    /* Estilos para o modo jogo */
    .character {
      position: absolute;
      width: auto;
      height: auto;
      z-index: 5;
    }

    .cave-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
    }

    /* Estilos do Gauge de Carregamento */
    .loading-gauge-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 20;
      background-color: rgba(18, 18, 18, 0.95);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }

    .loading-gauge-container.active {
      display: flex;
    }

    .gauge-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #e63946;
    }

    .gauge-bar {
      width: 250px;
      height: 30px;
      background-color: #2a2a2a;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid #e63946;
    }

    .gauge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e63946, #d62839);
      transition: width 0.1s linear;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .gauge-percent {
      margin-top: 10px;
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="image-container" id="gameContainer">
      <img id="mainImage" src="dragao1.jpeg" alt="Dragões em combate">
      <div class="button-group" id="buttonGroup">
        <button class="btn btn-play" id="playBtn">Jogar</button>
        <button class="btn btn-edit">Editar dragão</button>
      </div>

      <!-- Gauge de Carregamento -->
      <div class="loading-gauge-container" id="loadingGaugeContainer">
        <div class="gauge-title">Carregando...</div>
        <div class="gauge-bar">
          <div class="gauge-fill" id="gaugeFill"></div>
        </div>
        <div class="gauge-percent" id="gaugePercent">0%</div>
      </div>
    </div>
  </div>

  <script>
    const playBtn = document.getElementById('playBtn');
    const gameContainer = document.getElementById('gameContainer');
    const mainImage = document.getElementById('mainImage');
    const buttonGroup = document.getElementById('buttonGroup');
    const loadingGaugeContainer = document.getElementById('loadingGaugeContainer');
    const gaugeFill = document.getElementById('gaugeFill');
    const gaugePercent = document.getElementById('gaugePercent');

    // Função para pré-carregar uma imagem
    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => reject(new Error(`Erro ao carregar: ${src}`));
        img.src = src;
      });
    }

    // Função para atualizar o gauge
    function updateGauge(percent) {
      gaugeFill.style.width = percent + '%';
      gaugePercent.textContent = Math.round(percent) + '%';
    }

    playBtn.addEventListener('click', async function() {
      // Mostra o gauge de carregamento
      loadingGaugeContainer.classList.add('active');
      buttonGroup.style.display = 'none';

      // Lista de imagens a carregar
      const imagesToLoad = ['cave.jpeg', 'seqd.png', 'cave1.png'];
      let loadedCount = 0;

      try {
        // Carrega todas as imagens
        for (const imageSrc of imagesToLoad) {
          await preloadImage(imageSrc);
          loadedCount++;
          const progressPercent = (loadedCount / imagesToLoad.length) * 100;
          updateGauge(progressPercent);
          
          // Pequeno delay para visualizar o progresso
          await new Promise(resolve => setTimeout(resolve, 300));
        }

        // Aguarda mais um pouco para o gauge chegar a 100%
        await new Promise(resolve => setTimeout(resolve, 500));

        // Esconde o gauge
        loadingGaugeContainer.classList.remove('active');

        // Remove imagens overlay anteriores se existirem
        const existingOverlays = gameContainer.querySelectorAll('.character, .cave-overlay');
        existingOverlays.forEach(el => el.remove());

        // Muda a imagem principal para cave.jpeg
        mainImage.src = 'cave.jpeg';
        mainImage.alt = 'Caverna';

        // Adiciona a imagem seqd.png na posição x:30, y:100
        const seqdImage = document.createElement('img');
        seqdImage.src = 'seqd.png';
        seqdImage.alt = 'Personagem';
        seqdImage.className = 'character';
        seqdImage.style.left = '30px';
        seqdImage.style.top = '-3000px';
        gameContainer.appendChild(seqdImage);

        // Adiciona cave1.png na mesma posição (sobreposto)
        const caveOverlay = document.createElement('img');
        caveOverlay.src = 'cave1.png';
        caveOverlay.alt = 'Sobreposição da caverna';
        caveOverlay.style.top = '-20px';
        caveOverlay.className = 'cave-overlay';
        gameContainer.appendChild(caveOverlay);

      } catch (error) {
        console.error('Erro ao carregar imagens:', error);
        loadingGaugeContainer.classList.remove('active');
        alert('Erro ao carregar as imagens do jogo. Tente novamente.');
        buttonGroup.style.display = 'flex';
      }
    });
  </script>

</body>
</html>
